<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Наша История</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>История наших приключений ❤️</h1>
  </header>

  <main>
    <!-- Игры -->
    <section class="section-block">
  <h2>Совместные игры 🎮</h2>
  <div class="card-grid">
    
    <!-- Карточка Schedule I -->
    <div class="card game-card">
      <div class="game-header">
        <h3>Schedule I</h3>
        <span class="hours">⏱️ 150 часов вместе</span>
      </div>
      
      <!-- Главная обложка или первый скриншот -->
      <img src="assets/Schedule/photo_2026-08-22_19-01-18.jpg" alt="Schedule IГлавный скрин" class="main-img">
      
      <p class="comment">«Наши безумные ночи в игре»</p>
      
      <!-- Мини-галерея со всеми скриншотами -->
      <div class="screenshots-preview">
        <h4>Скриншоты из игры:</h4>
        <div class="shots-grid">
          <img src="assets/Schedule/photo_2026-08-22_19-01-18.jpg" alt="Скрин 1">
          <img src="assets/Schedule/photo_2026-08-22_19-19-57.jpg" alt="Скрин 2">
          <img src="assets/Schedule/photo_2026-08-22_19-36-15.jpg" alt="Скрин 3">
        </div>
      </div>

      <span class="badge">Ачивка: «Легендарный дуэт» 🏆</span>
    </div>
    
      </div>
    </section>

    <!-- Фильмы -->
    <section class="section-block">
      <h2>Просмотренные фильмы 🍿</h2>
      <div class="card-grid">

        <div class="card">
          <img src="https://via.placeholder.com/300x160" alt="Фильм">
          <h3>Интерстеллар</h3>
          <p>Наша оценка: <strong>10 / 10</strong></p>
          <p class="comment">«Плакали оба на сцене с видеосообщениями»</p>
        </div>

      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
